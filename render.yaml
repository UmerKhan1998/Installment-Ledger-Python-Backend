services:
  - type: web
    name: installment-ledger-python-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # set in the Render dashboard (Neon connection string)
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # e.g. https://your-frontend.onrender.com
